text:
  en:
    title: "Our work in Thailand | guidetothai"
    description: "A look at what we do every day in Thailand: VIP airport reception, hospital appointments, family trips, shipping and company setup."
    pill: "Our work"
    h1: "Every day, on the ground in Thailand"
    lead: "Since 2017 we have been meeting travellers at the airport, walking patients into hospital appointments, planning family trips and shipping goods home."
    stats:
      - { n: "2017", t: "In the market since" }
      - { n: "8", t: "Services under one roof" }
