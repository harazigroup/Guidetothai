    follow_h: "تابع رحلاتنا"
    follow_p: "ننشر رحلات حقيقية وزيارات المستشفيات ونصائح من تايلند على إنستغرام وتيك توك."
  th:
    title: "ผลงานของเราในประเทศไทย | guidetothai"
    description: "สิ่งที่เราทำทุกวันในประเทศไทย: ต้อนรับ VIP ที่สนามบิน นัดหมายโรงพยาบาล ทริปครอบครัว ขนส่งสินค้า และจดทะเบียนบริษัท"
    pill: "ผลงานของเรา"
    h1: "ทุกวัน เราอยู่เคียงข้างคุณในประเทศไทย"
    lead: "ตั้งแต่ปี 2017 เราต้อนรับนักเดินทางที่สนามบิน พาผู้ป่วยไปพบแพทย์ วางแผนทริปครอบครัว และส่งสินค้ากลับบ้าน"
    stats:
      - { n: "2017", t: "ให้บริการตั้งแต่ปี" }
      - { n: "8", t: "บริการครบในที่เดียว" }
      - { n: "3", t: "ภาษา: อาหรับ · อังกฤษ · ไทย" }
    gallery_eyebrow: "แกลเลอรี"
    gallery_h: "สิ่งที่เราทำ"
    follow_h: "ติดตามการเดินทางของเรา"
    follow_p: "เราแชร์ทริปจริง การไปโรงพยาบาล และเคล็ดลับจากประเทศไทยบน Instagram และ TikTok"
