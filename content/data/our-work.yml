    follow_p: "We share real trips, hospital visits and tips from Thailand on Instagram and TikTok."
  ar:
    title: "أعمالنا في تايلند | دليلك إلى تايلند"
    description: "نظرة على ما نقدمه يومياً في تايلند: استقبال VIP في المطار، مواعيد المستشفيات، الرحلات العائلية، الشحن وفتح الشركات."
    pill: "أعمالنا"
    h1: "كل يوم، معك على أرض تايلند"
    lead: "منذ 2017 ونحن نستقبل المسافرين في المطار، ونرافق المرضى إلى مواعيدهم، ونخطط رحلات العائلات، ونشحن البضائع إلى بلدانهم."
    stats:
      - { n: "2017", t: "في السوق منذ" }
